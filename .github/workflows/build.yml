name: .net Build

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    branches:
      - '**/main'
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: uSync.Hangfire
        run: dotnet build .\uSync.Hangfire\uSync.Hangfire.csproj -c Release

      - name: uSync.Complete.Hangfire
        run: dotnet build .\uSync.Complete.Hangfire\uSync.Complete.Hangfire.csproj
