name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 9.0.x

      - name: uSync.Hangfire
        run: dotnet pack .\uSync.Hangfire\uSync.Hangfire.csproj -c Release /p:Version=${{github.ref_name}}

      - name: uSync.Complete.Hangfire
        run: dotnet pack .\uSync.Complete.Hangfire\uSync.Complete.Hangfire.csproj -c Release /p:Version=${{github.ref_name}}

      - name: Push to NuGet
        run: dotnet nuget push **\*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
