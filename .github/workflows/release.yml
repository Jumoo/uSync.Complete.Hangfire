name: Release Package

# Publishing is triggered by pushing a version tag:
#
#   git tag 17.0.3 && git push origin 17.0.3

permissions:
  contents: read

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  config: Release
  out_folder: ./build-out/
  nuget_source: https://api.nuget.org/v3/index.json

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # full history, the branch containment check below needs it
          fetch-depth: 0

      - name: check the tag is on a release branch
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          branches=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')
          echo "Tagged commit is on:"
          echo "$branches" | sed 's/^/  /'
          if ! printf '%s\n' "$branches" | grep -qE '^origin/(v[0-9]+/)?main$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main or v{major}/main - refusing to publish"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: restore
        run: |
          dotnet restore .\uSync.Hangfire\uSync.Hangfire.csproj --locked-mode
          dotnet restore .\uSync.Complete.Hangfire\uSync.Complete.Hangfire.csproj --locked-mode

      - name: build
        run: >
          dotnet build .\uSync.Hangfire\uSync.Hangfire.csproj -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true &&
          dotnet build .\uSync.Complete.Hangfire\uSync.Complete.Hangfire.csproj -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true

      # deliberately not --no-build: the version has to be stamped onto the assembly as
      # well as the nuspec, so these steps rebuild with it.
      - name: package
        run: >
          dotnet pack .\uSync.Hangfire\uSync.Hangfire.csproj
          -c ${{ env.config }} --output ${{ env.out_folder }}
          /p:version=${{ github.ref_name }}
          -p:ContinuousIntegrationBuild=true &&
          dotnet pack .\uSync.Complete.Hangfire\uSync.Complete.Hangfire.csproj
          -c ${{ env.config }} --output ${{ env.out_folder }}
          /p:version=${{ github.ref_name }}
          -p:ContinuousIntegrationBuild=true

      # keep a copy regardless of what happens on the push
      - name: upload packages as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-release-${{ github.ref_name }}
          path: ${{ env.out_folder }}

      # --skip-duplicate so re-running a tag is a no-op rather than a failure
      - name: push to nuget
        run: >
          dotnet nuget push "${{ env.out_folder }}*.nupkg"
          -k ${{ secrets.NUGET_API_KEY }}
          -s ${{ env.nuget_source }}
          --skip-duplicate
